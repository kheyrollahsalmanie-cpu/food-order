name: build-apk
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify HTML sources
        run: test -s app/src/main/assets/index.html && cmp -s index.html app/src/main/assets/index.html
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/food-order-v75.apk
      - uses: actions/upload-artifact@v4
        with:
          name: food-order-v75-apk
          path: app/build/outputs/apk/debug/food-order-v75.apk
      - uses: actions/upload-artifact@v4
        with:
          name: food-order-v75-html
          path: index.html
